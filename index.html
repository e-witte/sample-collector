          el('button', { class: 'btn small', onclick: () => openProjectEditor(p, redraw) }, 'Edit'),
          el('button', { class: 'btn small danger', onclick: async () => {
            if (!confirm(`Delete project "${p.name}"? Existing samples will keep the reference.`)) return;
            await dbDel('projects', p.id); redraw();
          }}, 'Delete'),
        ),
        (p.customFields||[]).length ? el('div', { class: 'row wrap', style: { marginTop: '8px' } },
          ...p.customFields.map(cf => el('span', { class: 'tag' }, `${cf.label}${cf.unit ? ' ['+cf.unit+']' : ''}`))
        ) : null
      ))
    );
    const addBtn = el('button', { class: 'btn primary block', onclick: () => openProjectEditor({ name: '', customFields: [] }, redraw) }, '+ New project');
    root.append(
      el('div', { class: 'card' },
        el('div', { class: 'muted', style: { marginBottom: '8px', fontSize: '13px' } },
          'Projects sync to your shared Google Sheet on every Sync. Tap below to pull teammates\' projects (and the cloud sample count for ID generation) without uploading anything.'),
        pullBtn,
      ),
      list,
      addBtn
    );
  };
  redraw();
};

// Normalize a label+unit pair into the Google-Sheet column key. Same algorithm
// the editor uses on Save — exposed here so that "suggested fields" can reuse
// the exact same key as the original and land in the same sheet column.
const customFieldKey = (label, unit) => {
  const slug = (label || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  return slug + (unit ? '_' + unit : '');
};

// Scan every project for previously-used custom fields so we can suggest them
// when editing a project. Deduplicated by generated key so that two projects
// using "Standard length (mm)" merge into one suggestion — and so tapping it
// reuses the existing column on the Google Sheet instead of making a new one.
const collectFieldSuggestions = async () => {
  const projects = await dbAll('projects');
  const byKey = new Map();     // key -> { key, label, unit, type, usageCount }
  for (const p of projects) {
    for (const cf of (p.customFields || [])) {
      if (!cf.label) continue;
      const key = cf.key || customFieldKey(cf.label, cf.unit);
      const existing = byKey.get(key);
      if (existing) {
        existing.usageCount++;
      } else {
        byKey.set(key, {
          key,
          label: cf.label,
          unit: cf.unit || '',
          type: cf.type || 'text',
          usageCount: 1,
        });
      }
    }
  }
  // Most-used first, then alphabetical.
  return Array.from(byKey.values()).sort((a, b) =>
    b.usageCount - a.usageCount || a.label.localeCompare(b.label)
  );
};

const openProjectEditor = (project, onDone) => {
  showDialog(project.id ? 'Edit project' : 'New project', async (dlg, close) => {
    const name = el('input', { type: 'text', placeholder: 'Project name', value: project.name || '' });
    const fieldsHost = el('div');
    const customFields = [...(project.customFields || [])];

    // Backfill keys on any pre-existing fields so equality checks work.
    customFields.forEach(cf => {
      if (!cf.key || cf.key.startsWith('field_')) cf.key = customFieldKey(cf.label, cf.unit);
    });

    const suggestions = await collectFieldSuggestions();
    const suggestionHost = el('div', { class: 'suggestion-chips' });

    const isFieldActive = (sug) => customFields.some(cf => (cf.key || customFieldKey(cf.label, cf.unit)) === sug.key);

    const drawSuggestions = () => {
      suggestionHost.innerHTML = '';
      const available = suggestions.filter(s => !isFieldActive(s));
      if (!available.length) {
        if (suggestions.length) {
          suggestionHost.appendChild(el('div', { class: 'muted', style: { fontSize: '12px' } }, 'All previously-used fields are already on this project.'));
        } else {
          suggestionHost.appendChild(el('div', { class: 'muted', style: { fontSize: '12px' } }, 'No previously-used fields yet. As you save projects, common fields will show up here to tap and re-use.'));
        }
        return;
      }
      available.forEach(s => {
        const label = `${s.label}${s.unit ? ' (' + s.unit + ')' : ''}`;
        const chip = el('button', {
          class: 'suggestion-chip',
          title: `Reuses Sheet column "${s.key}" · used in ${s.usageCount} project${s.usageCount === 1 ? '' : 's'}`,
          onclick: () => {
            customFields.push({ key: s.key, label: s.label, unit: s.unit || '', type: s.type || 'text' });
            drawFields();
            drawSuggestions();
          }
        },
          el('span', { class: 'suggestion-add' }, '+'),
          el('span', {}, label),
          s.usageCount > 1 ? el('span', { class: 'suggestion-count' }, '×' + s.usageCount) : null,
        );
        suggestionHost.appendChild(chip);
      });
    };

    const drawFields = () => {
      fieldsHost.innerHTML = '';
      if (!customFields.length) {
        fieldsHost.appendChild(el('div', { class: 'muted', style: { fontSize: '13px', padding: '4px 0' } }, 'No custom fields yet.'));
      }
      customFields.forEach((cf, i) => {
        const row = el('div', { class: 'tissue-row' },
          el('span', { class: 'tissue-code' }, cf.type === 'number' ? '#' : 'T'),
          el('div', {},
            el('input', { type: 'text', value: cf.label, placeholder: 'Field label', oninput: (e) => { cf.label = e.target.value; cf.key = customFieldKey(cf.label, cf.unit); }, style: { marginBottom: '4px' } }),
            el('div', { class: 'row' },
              el('input', { type: 'text', value: cf.unit || '', placeholder: 'unit', oninput: (e) => { cf.unit = e.target.value; cf.key = customFieldKey(cf.label, cf.unit); } }),
              el('select', { onchange: (e) => cf.type = e.target.value },
                el('option', { value: 'text', selected: cf.type === 'text' ? '' : null }, 'Text'),
                el('option', { value: 'number', selected: cf.type === 'number' ? '' : null }, 'Number'),
              ),
            )
          ),
          el('button', { class: 'btn small danger', onclick: () => { customFields.splice(i, 1); drawFields(); drawSuggestions(); }}, '×')
        );
        fieldsHost.appendChild(row);
      });
    };

    dlg.append(
      el('div', { class: 'field' }, el('label', {}, 'Name'), name),
      el('div', { class: 'field' },
        el('label', {}, 'Custom fields (shown when collecting for this project)'),
        fieldsHost,
        el('button', { class: 'btn block', style: { marginTop: '6px' }, onclick: () => {
          customFields.push({ key: 'field_' + (customFields.length+1), label: '', type: 'number', unit: '' });
          drawFields();
        }}, '+ Add blank field')
      ),
      el('div', { class: 'field' },
        el('label', {}, 'Or tap a previously-used field'),
        el('div', { class: 'muted', style: { fontSize: '12px', marginBottom: '6px' } }, 'Suggested fields reuse the same Google Sheet column, so data stays in one place.'),
        suggestionHost
      ),
      el('div', { class: 'row' },
        el('button', { class: 'btn block ghost', onclick: close }, 'Cancel'),
        el('button', { class: 'btn primary block', onclick: async () => {
          if (!name.value.trim()) { showToast('Project needs a name'); return; }
          // Finalize keys for any fields the user typed into freshly.
          customFields.forEach(cf => {
            if (!cf.key || cf.key.startsWith('field_')) cf.key = customFieldKey(cf.label, cf.unit);
          });
          const rec = { ...project, name: name.value.trim(), customFields, updatedAt: Date.now() };
          if (!rec.createdAt) rec.createdAt = Date.now();
          await dbPut('projects', rec);
          close();
          onDone();
        }}, 'Save'),
      )
    );
    drawFields();
    drawSuggestions();
  });
};

// ---------- Google Sheets sync ----------
const buildSheetRows = (samples, projects) => {
  const projMap = Object.fromEntries(projects.map(p => [p.id, p]));
  const rows = [];
  for (const s of samples) {
    const d = new Date(s.collectedAt);
    const base = {
      organism_id: s.id,
      species_code: s.speciesCode, species_latin: s.speciesLatin || '', species_common: s.speciesCommon || '',
      site_code: s.siteCode, site_name: s.siteName || '',
      collector_initials: s.collectorInitials || '',
      project: projMap[s.projectId]?.name || '',
      collected_at_iso: d.toISOString(),
      collected_at_date: d.toISOString().slice(0,10),
      collected_at_time: d.toTimeString().slice(0,8),
      latitude: s.lat != null ? Number(s.lat.toFixed(6)) : '',
      longitude: s.lng != null ? Number(s.lng.toFixed(6)) : '',
      gps_accuracy_m: s.gpsAccuracy != null ? Math.round(s.gpsAccuracy) : '',
      gps_source: s.gpsSource || '',
      photo_filenames: (s.photoFilenames || []).join(';'),
      notes: s.notes || '',
      created_at: new Date(s.createdAt).toISOString(),
      updated_at: new Date(s.updatedAt).toISOString(),
    };
    // Custom fields go as their own columns
    if (s.customFieldValues) for (const [k,v] of Object.entries(s.customFieldValues)) base[k] = v;
    const tissues = s.tissues || [];
    if (tissues.length === 0) {
      rows.push({ ...base, sample_id: s.id, tissue_code: '', tissue_name: '', preservation: '', storage_location: '' });
    } else {
      for (const t of tissues) {
        rows.push({
          ...base,
          sample_id: `${s.id}_${t.tissueCode}`,
          tissue_code: t.tissueCode, tissue_name: t.tissueName || '',
          preservation: t.preservation || '', storage_location: t.storageLocation || '',
        });
      }
    }
  }
  return rows;
};

// Serialize all reference lists so the server can merge the team's additions.
// Usage counts stay local (per-phone MRU sorting) — the sheet only holds the
// shared catalog itself.
const buildReferenceLists = async () => {
  const pick = (arr, keys) => arr.map(it => Object.fromEntries(keys.map(k => [k, it[k]]).filter(([_,v]) => v !== undefined)));
  return {
    species:          pick(await dbAll('species'),          ['code','latin','common','updatedAt']),
    sites:            pick(await dbAll('sites'),            ['code','name','updatedAt']),
    tissues:          pick(await dbAll('tissues'),          ['code','name','updatedAt']),
    preservations:    pick(await dbAll('preservations'),    ['name','updatedAt']),
    storageLocations: pick(await dbAll('storageLocations'), ['name','updatedAt']),
    projects:         (await dbAll('projects')).map(p => ({ name: p.name, customFields: p.customFields || [], updatedAt: p.updatedAt })),
  };
};

// Merge server-returned reference lists into local IndexedDB. New items are
// added; existing items keep local usage counts + lastUsedAt (those are local
// MRU signals, not shared). For projects we match by name since ids differ
// per-phone.
const mergeReferenceLists = async (remote) => {
  if (!remote || typeof remote !== 'object') return { added: 0 };
  let added = 0;
  const mergeByKey = async (store, keyField) => {
    const incoming = remote[store] || [];
    const locals = await dbAll(store);
    const localByKey = Object.fromEntries(locals.map(it => [String(it[keyField]), it]));
    for (const item of incoming) {
      const keyVal = item[keyField];
      if (keyVal == null || keyVal === '') continue;
      const existing = localByKey[String(keyVal)];
      if (!existing) {
        await dbPut(store, { ...item, usageCount: 0, lastUsedAt: null });
        added++;
      } else {
        // Fill in any fields that are blank locally (e.g. latin/common added by a teammate).
        const merged = { ...existing };
        let changed = false;
        for (const k of Object.keys(item)) {
          if (k === 'usageCount' || k === 'lastUsedAt') continue;
          if ((merged[k] == null || merged[k] === '') && item[k] != null && item[k] !== '') {
            merged[k] = item[k]; changed = true;
          }
        }
        if (changed) await dbPut(store, merged);
      }
    }
  };
  await mergeByKey('species', 'code');
  await mergeByKey('sites', 'code');
  await mergeByKey('tissues', 'code');
  await mergeByKey('preservations', 'name');
  await mergeByKey('storageLocations', 'name');

  // Projects: match by name (not id — local ids differ per phone).
  const incomingProjects = remote.projects || [];
  const localProjects = await dbAll('projects');
  const localByName = Object.fromEntries(localProjects.map(p => [String(p.name).trim().toLowerCase(), p]));
  for (const p of incomingProjects) {
    if (!p.name) continue;
    const nameKey = String(p.name).trim().toLowerCase();
    const existing = localByName[nameKey];
    if (!existing) {
      await dbPut('projects', { name: p.name, customFields: p.customFields || [], createdAt: Date.now(), updatedAt: p.updatedAt || Date.now() });
      added++;
    } else if ((p.updatedAt || 0) > (existing.updatedAt || 0)) {
      existing.customFields = p.customFields || [];
      existing.updatedAt = p.updatedAt || Date.now();
      await dbPut('projects', existing);
    }
  }
  return { added };
};

// Pull every organism id from the cloud sheet into a local mirror store so the
// NN counter in genOrganismId can include teammates' samples. Tolerant of
// old/stale Apps Script deployments — if the endpoint can't return rows we
// just leave the mirror as-is.
const syncRemoteSamples = async (endpointUrl) => {
  try {
    const url = endpointUrl + (endpointUrl.includes('?') ? '&' : '?') + 'action=samples';
    const res = await fetch(url, { method: 'GET', redirect: 'follow' });
    if (!res.ok) return { ok: false, error: 'HTTP ' + res.status };
    const data = await res.json();
    if (!data || !data.ok || !Array.isArray(data.rows)) return { ok: false, error: 'No rows in response' };
    // Each sheet row is one tissue; collapse to one organism record per id.
    const toNum = (v) => {
      if (v == null || v === '') return null;
      const n = typeof v === 'number' ? v : parseFloat(v);
      return Number.isFinite(n) ? n : null;
    };
    const byId = {};
    for (const r of data.rows) {
      const oid = r.organism_id || r.sample_id;
      if (!oid || byId[oid]) continue;
      let mk = '', collectedAt = null;
      const dateStr = r.collected_at_iso || r.collected_at_date || '';
      if (dateStr) {
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) { mk = monthKey(d.getTime()); collectedAt = d.getTime(); }
      }
      byId[oid] = {
        id: String(oid),
        speciesCode: r.species_code || '',
        speciesLatin: r.species_latin || '',
        siteCode: r.site_code || '',
        siteName: r.site_name || '',
        speciesSiteMonth: `${r.species_code || ''}|${r.site_code || ''}|${mk}`,
        collectorInitials: r.collector_initials || '',
        collectedAtIso: r.collected_at_iso || '',
        collectedAt,
        lat: toNum(r.latitude),
        lng: toNum(r.longitude),
        gpsAccuracy: toNum(r.gps_accuracy_m),
        gpsSource: r.gps_source || '',
        fetchedAt: Date.now(),
      };
    }
    // Replace the mirror wholesale so collisions / renames on the server are picked up.
    await dbClear('remoteSamples');
    const records = Object.values(byId);
    for (const v of records) await dbPut('remoteSamples', v);
    return { ok: true, count: records.length };
  } catch (e) {
    return { ok: false, error: e && e.message ? e.message : String(e) };
  }
};

const syncToSheet = async ({ includeAll = false } = {}) => {
  const url = await getSetting('syncEndpoint');
  if (!url) throw new Error('No Sync URL set — paste your Apps Script Web App URL in Settings first.');
  const allSamples = await dbAll('samples');
  const pending = includeAll ? allSamples : allSamples.filter(s => s.syncStatus !== 'synced' || (s.lastSyncedAt || 0) < (s.updatedAt || 0));
  const projects = await dbAll('projects');
  const rows = buildSheetRows(pending, projects);
  const referenceLists = await buildReferenceLists();
  const body = JSON.stringify({ rows, sheetName: 'Samples', referenceLists, syncedAt: new Date().toISOString() });
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' from sync endpoint');
  let data;
  try { data = await res.json(); } catch { throw new Error('Sync endpoint did not return JSON. Check the Apps Script deployment.'); }
  if (!data.ok) throw new Error(data.error || 'Sync failed on server side.');

  // Apply any server-side renames from collision detection. Row sample_ids may be
  // {organismId} or {organismId}_{tissue}. We care about the organism-level id here.
  const renames = data.renames || {};
  const orgRenames = {};   // oldOrgId -> newOrgId
  for (const [oldId, newId] of Object.entries(renames)) {
    // Strip trailing tissue code if present so we can match to the organism row.
    const oldOrg = oldId.replace(/_[A-Z]+\d*$/, '');
    const newOrg = newId.replace(/_[A-Z]+\d*$/, '');
    if (!orgRenames[oldOrg]) orgRenames[oldOrg] = newOrg;
  }
  let renamedCount = 0;
  for (const s of pending) {
    const newOrgId = orgRenames[s.id];
    if (newOrgId && newOrgId !== s.id) {
      const oldOrgId = s.id;
      // Rewrite photos that referenced the old organism id.
      const photos = await dbIndexAll('photos', 'organismId', oldOrgId);
      for (const p of photos) {
        p.organismId = newOrgId;
        const m = /^(.+)_(\d+)\.jpg$/i.exec(p.filename || '');
        p.filename = m ? `${newOrgId}_${m[2]}.jpg` : `${newOrgId}_${p.seq || 1}.jpg`;
        await dbPut('photos', p);
      }
      // Rewrite the sample record itself under the new key.
      s.id = newOrgId;
      s.organismId = newOrgId;
      s.photoFilenames = (s.photoFilenames || []).map(f => {
        const m = /^(.+)_(\d+)\.jpg$/i.exec(f);
        return m ? `${newOrgId}_${m[2]}.jpg` : f;
      });
      s.renamedFrom = oldOrgId;
      s.syncStatus = 'synced';
      s.lastSyncedAt = Date.now();
      await dbPut('samples', s);
      await dbDel('samples', oldOrgId);
      renamedCount++;
    } else {
      s.syncStatus = 'synced';
      s.lastSyncedAt = Date.now();
      await dbPut('samples', s);
    }
  }

  // Merge back any new species/sites/tissues/preservations/storage/projects the
  // team has added from other phones. If the server didn't return a
  // `referenceLists` key at all, the deployed Apps Script is an older version
  // that doesn't know how to write those tabs — surface that so the collector
  // isn't left wondering why teammates' species never show up.
  const serverSupportsLists = data && Object.prototype.hasOwnProperty.call(data, 'referenceLists');
  const mergeReport = serverSupportsLists ? await mergeReferenceLists(data.referenceLists) : { added: 0 };

  // Refresh the local mirror of cloud samples so the NN counter on this phone
  // knows what teammates have already created. Best-effort — failures here
  // don't fail the overall sync.
  const remoteMirror = await syncRemoteSamples(url);

  return {
    ok: true,
    count: pending.length,
    rows: rows.length,
    total: allSamples.length,
    renamed: renamedCount,
    listsAdded: mergeReport.added,
    serverSupportsLists,
    remoteMirrorOk: !!remoteMirror.ok,
    remoteCount: remoteMirror.count || 0,
  };
};

// Pull team changes (reference lists + sample mirror) WITHOUT uploading any
// local samples. Used by the "Pull team changes" button. Returns a small
// status object the UI can render.
const pullTeamChanges = async () => {
  const url = await getSetting('syncEndpoint');
  if (!url) throw new Error('No Sync URL set — paste your Apps Script Web App URL in Settings first.');
  // ?action=lists returns the merged reference lists (project, species, etc.)
  let listResp;
  try {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=lists', { method: 'GET', redirect: 'follow' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    listResp = await res.json();
  } catch (e) {
    throw new Error('Could not reach the sheet: ' + (e && e.message ? e.message : e));
  }
  if (!listResp || !listResp.ok) throw new Error(listResp && listResp.error ? listResp.error : 'No data from server');
  if (!listResp.referenceLists) {
    // Old deployment — doesn't know how to return lists.
    return { ok: false, stale: true, added: 0, remoteCount: 0 };
  }
  const merge = await mergeReferenceLists(listResp.referenceLists);
  const mirror = await syncRemoteSamples(url);
  return { ok: true, added: merge.added, remoteCount: mirror.count || 0, remoteOk: !!mirror.ok };
};

// ---------- Browse cloud (read the Google Sheet back into the app) ----------
// Read-only view of every row in the team's shared sheet, with filters for
// species, collector, site, project, and date range. GETs the sheet via
// ?action=samples every time the view is opened.
const _browseCache = { ts: 0, data: null };
const BROWSE_CACHE_MS = 30 * 1000;

routes.browse = async (root) => {
  setTitle('Browse cloud');
  setBack(() => navigate('#home'));

  const syncUrl = await getSetting('syncEndpoint', '');
  if (!syncUrl) {
    root.appendChild(el('div', { class: 'card' },
      el('h2', {}, 'No sync URL'),
      el('p', { class: 'muted' }, 'The Browse view pulls directly from your Google Sheet. Paste the Apps Script Web App URL in Settings first.'),
      el('button', { class: 'btn primary block', onclick: () => navigate('#settings') }, 'Open Settings')
    ));
    return;
  }

  const loading = el('div', { class: 'card' }, el('div', { class: 'muted' }, 'Loading from Google Sheet…'));
  root.appendChild(loading);

  const fresh = _browseCache.data && (Date.now() - _browseCache.ts) < BROWSE_CACHE_MS;
  let rows = [];
  let loadError = null;
  let staleDeployment = false;   // true when the GET came back without a `rows` field
  try {
    if (fresh) {
      rows = _browseCache.data;
    } else {
      // The sheet's Apps Script doesn't support CORS preflight on arbitrary GET params,
      // so stick with the plain ?action= query.
      const res = await fetch(syncUrl + (syncUrl.includes('?') ? '&' : '?') + 'action=samples', { method: 'GET', redirect: 'follow' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Server returned no data');
      // If the deployed Apps Script is the old version, its doGet ignores
      // ?action=samples and just returns the liveness payload (no `rows` key).
      // Tell the user to redeploy rather than silently showing "empty".
      if (!Array.isArray(data.rows)) {
        staleDeployment = true;
        rows = [];
      } else {
        rows = data.rows;
        _browseCache.data = rows;
        _browseCache.ts = Date.now();
      }
    }
  } catch (e) {
    loadError = e;
  }
  loading.remove();

  if (loadError) {
    root.appendChild(el('div', { class: 'card' },
      el('h2', {}, 'Could not load cloud data'),
      el('p', { class: 'muted' }, String(loadError.message || loadError)),
      el('button', { class: 'btn primary block', onclick: () => requestRender() }, 'Retry')
    ));
    return;
  }

  if (staleDeployment) {
    root.appendChild(el('div', { class: 'card' },
      el('h2', {}, 'Apps Script needs a redeploy'),
      el('p', {}, 'Your Google Sheet replied, but without the data endpoint. That means the deployed Apps Script is the old version — saving the file in the editor does not update what the URL serves.'),
      el('p', { class: 'muted' }, 'Fix: open Apps Script on the sheet → Deploy → Manage deployments → pencil on the active one → Version: New version → Deploy. Keep the same deployment so the URL does not change.'),
      el('button', { class: 'btn primary block', onclick: () => { _browseCache.ts = 0; _browseCache.data = null; requestRender(); } }, 'Retry after redeploy')
    ));
    return;
  }

  if (!rows.length) {
    root.appendChild(el('div', { class: 'card' },
      el('h2', {}, 'Cloud is empty'),
      el('p', { class: 'muted' }, 'The endpoint responded, but the Samples tab has no rows yet. Sync a sample from any phone and retry.'),
      el('button', { class: 'btn primary block', onclick: () => { _browseCache.ts = 0; _browseCache.data = null; requestRender(); } }, 'Retry')
    ));
    return;
  }

  // Collapse tissue-level rows back into one organism row (keyed by organism_id).
  // The sheet stores one row per tissue; for the browse view we want one entry
  // per organism with the tissues listed as chips.
  const organisms = {};
  for (const r of rows) {
    const oid = r.organism_id || r.sample_id;
    if (!oid) continue;
    if (!organisms[oid]) {
      organisms[oid] = { ...r, organism_id: oid, _tissueCodes: [] };
    }
    if (r.tissue_code) organisms[oid]._tissueCodes.push(r.tissue_code);
  }
  const organismList = Object.values(organisms);

  // Build filter dimensions. Each entry is { value (what we filter by), label (what we show), sub (small-caps helper) }.
  // Species: show full Latin binomial. Sites: show full name. Collector: show initials. Project: show project name.
  const uniqueByValue = (mapper) => {
    const seen = new Map();
    for (const r of organismList) {
      const entry = mapper(r);
      if (!entry || entry.value == null || entry.value === '') continue;
      const k = String(entry.value);
      if (!seen.has(k)) seen.set(k, entry);
    }
    return Array.from(seen.values()).sort((a, b) => String(a.label).localeCompare(String(b.label)));
  };
  const speciesOpts = uniqueByValue(r => r.species_latin
    ? { value: r.species_code || r.species_latin, label: r.species_latin, sub: r.species_common || r.species_code || '' }
    : (r.species_code ? { value: r.species_code, label: r.species_code, sub: '' } : null));
  const siteOpts = uniqueByValue(r => r.site_name
    ? { value: r.site_code || r.site_name, label: r.site_name, sub: r.site_code || '' }
    : (r.site_code ? { value: r.site_code, label: r.site_code, sub: '' } : null));
  const collectorOpts = uniqueByValue(r => r.collector_initials ? { value: r.collector_initials, label: r.collector_initials, sub: '' } : null);
  const projectOpts = uniqueByValue(r => r.project ? { value: r.project, label: r.project, sub: '' } : null);

  // Filter state: `value`-keyed Sets so selection survives the chip list being
  // re-rendered as the user types in the per-filter search box.
  const filters = {
    species: new Set(),
    site: new Set(),
    collector: new Set(),
    project: new Set(),
    fromDate: '',
    toDate: '',
  };

  const listHost = el('div', { class: 'card' });

  // Per-filter chip group: label + search input + scrollable chip list.
  // Typing narrows the chip list to matching entries; selected chips always
  // stay visible at the top so the collector never "loses" a selection.
  const makeFilterGroup = (labelText, options, setRef) => {
    const chipHost = el('div', { class: 'filter-chips' });
    const search = el('input', {
      class: 'filter-search',
      type: 'search',
      placeholder: `Search ${labelText.toLowerCase()}…`,
      autocomplete: 'off',
      autocorrect: 'off',
      autocapitalize: 'none',
      spellcheck: 'false',
    });
    const redraw = () => {
      const q = search.value.trim().toLowerCase();
      chipHost.innerHTML = '';
      const visible = options.filter(opt => {
        if (setRef.has(opt.value)) return true;   // always keep selected chips visible
        if (!q) return true;
        return String(opt.label).toLowerCase().includes(q)
            || String(opt.sub || '').toLowerCase().includes(q);
      });
      // Selected first, then alphabetical by label
      visible.sort((a, b) => {
        const sa = setRef.has(a.value) ? 0 : 1;
        const sb = setRef.has(b.value) ? 0 : 1;
        if (sa !== sb) return sa - sb;
        return String(a.label).localeCompare(String(b.label));
      });
      if (!visible.length) {
        chipHost.appendChild(el('div', { class: 'filter-empty' }, 'No matches.'));
        return;
      }
      visible.forEach(opt => {
        const chip = el('button', {
          class: 'filter-chip' + (setRef.has(opt.value) ? ' active' : ''),
          onclick: () => {
            if (setRef.has(opt.value)) setRef.delete(opt.value);
            else setRef.add(opt.value);
            chip.classList.toggle('active', setRef.has(opt.value));
            renderList();
          }
        },
          el('span', {}, opt.label),
          opt.sub ? el('span', { class: 'chip-sub' }, opt.sub) : null,
        );
        chipHost.appendChild(chip);
      });
    };
    search.addEventListener('input', redraw);
    redraw();
    return el('div', { class: 'filter-row' },
      el('div', { class: 'filter-label' }, `${labelText} (${options.length})`),
      search,
      chipHost
    );
  };

  const fromIn = el('input', { type: 'date', value: '', onchange: (e) => { filters.fromDate = e.target.value; renderList(); } });
  const toIn = el('input', { type: 'date', value: '', onchange: (e) => { filters.toDate = e.target.value; renderList(); } });
  const clearBtn = el('button', { class: 'btn small ghost', onclick: () => {
    filters.species.clear(); filters.site.clear(); filters.collector.clear(); filters.project.clear();
    filters.fromDate = ''; filters.toDate = ''; fromIn.value = ''; toIn.value = '';
    root.querySelectorAll('.filter-chip.active').forEach(c => c.classList.remove('active'));
    renderList();
  }}, 'Clear filters');
  const refreshBtn = el('button', { class: 'btn small ghost', onclick: () => {
    _browseCache.ts = 0; _browseCache.data = null; requestRender();
  }}, '↻ Refresh');

  // Filters operate on the canonical value stored in the options (species_code
  // for species, site_code for sites, etc.). The chip label is Latin/full-name
  // for readability, but the underlying filter still matches whatever key we
  // chose when building the option list.
  const passesFilter = (r) => {
    if (filters.species.size) {
      const v = r.species_code || r.species_latin || '';
      if (!filters.species.has(v)) return false;
    }
    if (filters.site.size) {
      const v = r.site_code || r.site_name || '';
      if (!filters.site.has(v)) return false;
    }
    if (filters.collector.size && !filters.collector.has(r.collector_initials)) return false;
    if (filters.project.size && !filters.project.has(r.project)) return false;
    if (filters.fromDate || filters.toDate) {
      const d = (r.collected_at_date || '').slice(0,10);
      if (filters.fromDate && d && d < filters.fromDate) return false;
      if (filters.toDate && d && d > filters.toDate) return false;
    }
    return true;
  };

  const renderList = () => {
    const filtered = organismList.filter(passesFilter);
    filtered.sort((a,b) => String(b.collected_at_iso||'').localeCompare(String(a.collected_at_iso||'')));
    listHost.innerHTML = '';
    listHost.appendChild(el('div', { class: 'row', style: { alignItems: 'center', gap: '10px' } },
      el('h2', { style: { margin: 0 } }, 'Results'),
      el('span', { class: 'n-counter' }, `n=${filtered.length}`),
      el('span', { class: 'muted', style: { fontSize: '13px' } }, `of ${organismList.length} total`),
    ));
    if (!filtered.length) {
      listHost.appendChild(el('div', { class: 'empty', style: { marginTop: '10px' } }, 'Nothing matches those filters.'));
      return;
    }
    const page = filtered.slice(0, 200);
    const list = el('div', { class: 'list', style: { marginTop: '10px' } });
    page.forEach(r => {
      list.appendChild(el('div', { class: 'list-item', style: { cursor: 'default' } },
        el('div', {},
          el('div', { class: 'big-id' }, r.organism_id || r.sample_id || ''),
          el('div', { class: 'muted' }, `${r.species_latin || r.species_code || ''} · ${r.site_name || r.site_code || ''} · ${(r.collected_at_date || '').slice(0,10)}`),
          el('div', { class: 'row wrap', style: { marginTop: '4px' } },
            ...(r._tissueCodes || []).map(tc => el('span', { class: 'tissue-chip' }, `_${tc}`)),
            r.collector_initials ? el('span', { class: 'tag', style: { marginLeft: '6px' } }, r.collector_initials) : null,
            r.project ? el('span', { class: 'tag', style: { marginLeft: '6px' } }, r.project) : null,
          )
        )
      ));
    });
    listHost.appendChild(list);
    if (filtered.length > 200) {
      listHost.appendChild(el('div', { class: 'muted', style: { marginTop: '8px' } }, `Showing first 200. Narrow the filters to see more.`));
    }
  };

  root.append(
    el('div', { class: 'card' },
      el('div', { class: 'row', style: { justifyContent: 'space-between', alignItems: 'center' } },
        el('h2', { style: { margin: 0 } }, 'Filters'),
        el('div', { class: 'row' }, refreshBtn, clearBtn)
      ),
      speciesOpts.length ? makeFilterGroup('Species', speciesOpts, filters.species) : null,
      siteOpts.length ? makeFilterGroup('Site', siteOpts, filters.site) : null,
      collectorOpts.length ? makeFilterGroup('Collector', collectorOpts, filters.collector) : null,
      projectOpts.length ? makeFilterGroup('Project', projectOpts, filters.project) : null,
      el('div', { class: 'filter-row' },
        el('div', { class: 'filter-label' }, 'Date'),
        el('div', { class: 'row' },
          el('span', { class: 'muted', style: { marginRight: '6px' } }, 'from'),
          fromIn,
          el('span', { class: 'muted', style: { margin: '0 6px' } }, 'to'),
          toIn,
        )
      ),
    ),
    listHost
  );
  renderList();
};

      }

  }}, syncUrl ? `⤴ Sync ${pendingCount} pending to Google Sheet` : 'Sync (set a Sync URL in Settings first)');

  // uploading anything. Useful when phone has nothing pending but you want

    pullBtn.disabled = true;

      } else {

          ? `Pulled ${r.added} new list entr${r.added===1?'y':'ies'} (and ${r.remoteCount} cloud sample${r.remoteCount===1?'':'s'} for ID counter)`

      }
    } catch (e) {
      alert('Pull failed: ' + e.message);
    } finally {
      pullBtn.disabled = syncUrl ? null : '';
      pullBtn.textContent = origText;
    }
  }}, '↻ Pull team changes (no upload)');

  root.append(
    el('div', { class: 'card' },
      el('h2', {}, 'Google Sheet sync'),
      syncBtn,
      pullBtn,
      el('div', { class: 'muted', style: { marginTop: '6px' } },
        syncUrl
          ? `${pendingCount} of ${samples.length} organism records are unsynced. Sync is additive and upsert-safe (re-syncing a record updates it in place).`
          : 'One-time setup: deploy apps-script.gs to a Google Sheet (see README), copy the Web App URL, paste it in Settings → Sync URL.'
      ),
      el('button', { class: 'btn block ghost', style: { marginTop: '8px' }, onclick: () => navigate('#settings') }, 'Open Settings'),
    ),
    el('div', { class: 'card' },
      el('h2', {}, 'Local downloads'),
      el('p', {}, `You have ${samples.length} organism records and ${photos.length} photos on this phone.`),
      el('button', { class: 'btn block', onclick: () => exportCSV(samples) }, '⤓ Download CSV (one row per tissue)'),
      el('button', { class: 'btn block', style: { marginTop: '8px' }, onclick: () => exportSamplesJSON(samples) }, '⤓ Download JSON backup'),
    ),
    el('div', { class: 'card' },
      el('h2', {}, 'Photos'),
      el('p', {}, `Bundle all ${photos.length} photo${photos.length===1?'':'s'} into a single ZIP with a /thumbnails folder and a photos.csv manifest. Download over Wi-Fi, then drag onto your external hard drive.`),
      (() => {
        const btn = el('button', { class: 'btn primary block', disabled: photos.length ? null : '', onclick: async () => {

const csvEscape = (v) => {
  if (v == null) return '';
  const s = String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
};

const exportCSV = async (samples) => {
  // One row per tissue, or one row per organism if no tissues.
  const projects = await dbAll('projects');
  const projMap = Object.fromEntries(projects.map(p => [p.id, p]));
  // Collect all custom field keys used
  const allCfKeys = new Set();
  for (const s of samples) for (const k of Object.keys(s.customFieldValues || {})) allCfKeys.add(k);
  const cfHeaders = Array.from(allCfKeys);

  const base = ['sample_id','organism_id','tissue_code','tissue_name','preservation','storage_location',
    'species_code','species_latin','species_common','site_code','site_name',
    'collector_initials','project','collected_at_iso','collected_at_date','collected_at_time',
    'latitude','longitude','gps_accuracy_m','photo_filenames','notes','created_at','updated_at'];
  const headers = [...base, ...cfHeaders];
  const lines = [headers.join(',')];
  const addRow = (s, t) => {
    const d = new Date(s.collectedAt);
    const row = [
      t ? `${s.id}_${t.tissueCode}` : s.id,
      s.id,
      t ? t.tissueCode : '',
      t ? t.tissueName : '',
      t ? t.preservation : '',
      t ? (t.storageLocation || '') : '',
      s.speciesCode, s.speciesLatin, s.speciesCommon || '',
      s.siteCode, s.siteName || '',
      s.collectorInitials || '',
      projMap[s.projectId]?.name || '',
      d.toISOString(),
      d.toISOString().slice(0,10),
      d.toTimeString().slice(0,8),
      s.lat != null ? s.lat.toFixed(6) : '',
      s.lng != null ? s.lng.toFixed(6) : '',
      s.gpsAccuracy != null ? Math.round(s.gpsAccuracy) : '',
      (s.photoFilenames || []).join(';'),
      s.notes || '',
      new Date(s.createdAt).toISOString(),
      new Date(s.updatedAt).toISOString(),
      ...cfHeaders.map(k => s.customFieldValues?.[k] ?? ''),
    ];
    lines.push(row.map(csvEscape).join(','));
  };
  for (const s of samples) {
    if (s.tissues && s.tissues.length) for (const t of s.tissues) addRow(s, t);
    else addRow(s, null);
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  downloadBlob(blob, `samples_${new Date().toISOString().slice(0,10)}.csv`);
};

const downloadAllPhotos = async () => {
  const photos = await dbAll('photos');
  if (!photos.length) { showToast('No photos to download'); return; }
  // On iOS, repeated programmatic downloads are flaky; do them sequentially with a short delay.
  for (const p of photos) {
    downloadBlob(p.fullBlob, p.filename);
    await new Promise(r => setTimeout(r, 400));
  }
  showToast(`Started ${photos.length} downloads`);
};

// ---------- ZIP export (stored / uncompressed, pure JS, no library) ----------
const _crc32Table = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
const crc32 = (u8) => {
  let c = 0xffffffff;
  for (let i = 0; i < u8.length; i++) c = _crc32Table[(c ^ u8[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
};
// entries: [{ name: 'photos/foo.jpg', data: Uint8Array }, ...]
const makeZip = async (entries) => {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = ((d.getHours() & 0x1f) << 11) | ((d.getMinutes() & 0x3f) << 5) | ((d.getSeconds() >> 1) & 0x1f);
  const dosDate = (((d.getFullYear() - 1980) & 0x7f) << 9) | (((d.getMonth() + 1) & 0xf) << 5) | (d.getDate() & 0x1f);
  for (const e of entries) {
    const name = enc.encode(e.name);
    const crc = crc32(e.data);
    const size = e.data.length;
    const lfh = new Uint8Array(30 + name.length);
    const dv = new DataView(lfh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);   // UTF-8 filenames
    dv.setUint16(8, 0, true);        // method: stored
    dv.setUint16(10, dosTime, true);
    dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, size, true);
    dv.setUint32(22, size, true);
    dv.setUint16(26, name.length, true);
    dv.setUint16(28, 0, true);
    lfh.set(name, 30);
    parts.push(lfh, e.data);
    central.push({ name, crc, size, offset, dosTime, dosDate });
    offset += lfh.length + size;
  }
  const cdStart = offset;
  for (const c of central) {
    const cde = new Uint8Array(46 + c.name.length);
    const dv = new DataView(cde.buffer);
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 20, true);
    dv.setUint16(8, 0x0800, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, c.dosTime, true);
    dv.setUint16(14, c.dosDate, true);
    dv.setUint32(16, c.crc, true);
    dv.setUint32(20, c.size, true);
    dv.setUint32(24, c.size, true);
    dv.setUint16(28, c.name.length, true);
    dv.setUint16(30, 0, true);
    dv.setUint16(32, 0, true);
    dv.setUint16(34, 0, true);
    dv.setUint16(36, 0, true);
    dv.setUint32(38, 0, true);
    dv.setUint32(42, c.offset, true);
    cde.set(c.name, 46);
    parts.push(cde);
    offset += cde.length;
  }
  const cdSize = offset - cdStart;
  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(4, 0, true);
  edv.setUint16(6, 0, true);
  edv.setUint16(8, central.length, true);
  edv.setUint16(10, central.length, true);
  edv.setUint32(12, cdSize, true);
  edv.setUint32(16, cdStart, true);
  edv.setUint16(20, 0, true);
  parts.push(eocd);
  return new Blob(parts, { type: 'application/zip' });
};

// Re-encode a blob as a smaller JPEG thumbnail if one isn't cached yet.
const makeJpegThumb = async (blob, maxEdge = 480, quality = 0.6) => {
  try {
    const bmp = await createImageBitmap(blob);
    const scale = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    const canvas = (typeof OffscreenCanvas !== 'undefined') ? new OffscreenCanvas(w, h) : Object.assign(document.createElement('canvas'), { width: w, height: h });
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bmp, 0, 0, w, h);
    if (canvas.convertToBlob) return await canvas.convertToBlob({ type: 'image/jpeg', quality });
    return await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
  } catch (e) {
    return null;
  }
};

const exportPhotosZip = async (progressCb) => {
  const photos = await dbAll('photos');
  if (!photos.length) { showToast('No photos to export'); return; }
  const samples = await dbAll('samples');
  const byOrg = Object.fromEntries(samples.map(s => [s.id, s]));

  const entries = [];
  const manifestRows = [
    ['filename','sample_id','collector_initials','species_code','site_code','collected_at_iso','latitude','longitude','gps_accuracy_m'].join(',')
  ];

  for (let i = 0; i < photos.length; i++) {
    const p = photos[i];
    if (progressCb) progressCb(i, photos.length, p.filename);
    const fullBuf = new Uint8Array(await p.fullBlob.arrayBuffer());
    entries.push({ name: `photos/${p.filename}`, data: fullBuf });
    let thumbBlob = p.thumbBlob;
    if (!thumbBlob) thumbBlob = await makeJpegThumb(p.fullBlob);
    if (thumbBlob) {
      const thumbBuf = new Uint8Array(await thumbBlob.arrayBuffer());
      entries.push({ name: `thumbnails/${p.filename}`, data: thumbBuf });
    }
    const s = byOrg[p.organismId];
    manifestRows.push([
      p.filename,
      p.organismId,
      s?.collectorInitials || '',
      s?.speciesCode || '',
      s?.siteCode || '',
      s ? new Date(s.collectedAt).toISOString() : '',
      s?.lat != null ? s.lat.toFixed(6) : '',
      s?.lng != null ? s.lng.toFixed(6) : '',
      s?.gpsAccuracy != null ? Math.round(s.gpsAccuracy) : '',
    ].map(csvEscape).join(','));
  }
  entries.push({ name: 'photos.csv', data: new TextEncoder().encode(manifestRows.join('\n')) });
  entries.push({ name: 'README.txt', data: new TextEncoder().encode(
    'Ichthyolog photo archive\n' +
    '==============================\n\n' +
    'photos/          full-resolution JPEGs as captured in the field\n' +
    'thumbnails/      reduced-quality previews (max 480px edge, ~60% quality)\n' +
    'photos.csv       manifest mapping each filename to sample_id, collector, timestamp, GPS\n\n' +
    'Filenames follow {SPECIES}_{SITE}_{MMYYNN}_{sequence}.jpg\n' +
    `Exported ${new Date().toISOString()} by ${navigator.userAgent.includes('iPhone') ? 'iPhone' : 'browser'}\n`
  )});

  const zipBlob = await makeZip(entries);
  const stamp = new Date().toISOString().slice(0,10);
  downloadBlob(zipBlob, `ichthyolog_photos_${stamp}.zip`);
  return { photos: photos.length, bytes: zipBlob.size };
};

const downloadBlob = (blob, filename) => {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
};

// ---------- Settings ----------
routes.settings = async (root) => {
  setTitle('Settings');
  setBack(() => navigate('#home'));
  const personId = await getSetting('currentPersonId');
  const people = await dbAll('people');
  const teamPasscode = await getSetting('teamPasscode', 'field');
  const current = people.find(p => p.id === personId);

  const passIn = el('input', { type: 'text', value: teamPasscode });
  passIn.addEventListener('change', async () => { await setSetting('teamPasscode', passIn.value.trim()); showToast('Passcode saved'); });

  const syncIn = el('input', { type: 'url', placeholder: 'https://script.google.com/macros/s/…/exec', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false', value: await getSetting('syncEndpoint', '') });
  syncIn.addEventListener('change', async () => { await setSetting('syncEndpoint', syncIn.value.trim()); showToast('Sync URL saved'); });
  const testSyncBtn = el('button', { class: 'btn', onclick: async () => {
    if (!syncIn.value.trim()) { showToast('Paste a URL first'); return; }
    try {
      const r = await fetch(syncIn.value.trim(), { method: 'GET' });
      const data = await r.json();
      alert(data.message || (data.ok ? 'Endpoint is live.' : 'Response: ' + JSON.stringify(data)));
    } catch(e) {
      alert('Test failed: ' + e.message + '\n\nIf you see a CORS or opaque error, re-deploy the Apps Script as "Anyone" access.');
    }
  }}, 'Test connection');

  const peopleHost = el('div');
  const drawPeople = () => {
    peopleHost.innerHTML = '';
    for (const p of people) {
      const row = el('div', { class: 'row', style: { padding: '8px 0', borderBottom: '1px solid var(--border)' } },
        el('div', { style: { flex: 1 } },
          el('div', { style: { fontWeight: 600 } }, p.name),
          el('span', { class: 'code' }, p.initials),
        ),
        p.id === personId ? el('span', { class: 'pill accent' }, 'Active') : el('button', { class: 'btn small', onclick: async () => {
          await setSetting('currentPersonId', p.id);
          showToast(`Switched to ${p.name}`);
          render();
        }}, 'Use this name'),
        el('button', { class: 'btn small danger', onclick: async () => {
          if (!confirm(`Remove ${p.name}?`)) return;
          await dbDel('people', p.id);
          const idx = people.findIndex(x => x.id === p.id); if (idx>=0) people.splice(idx,1);
          drawPeople();
        }}, 'Remove'),
      );
      peopleHost.appendChild(row);
    }
  };
  drawPeople();

  const addName = el('input', { type: 'text', placeholder: 'Name' });
  const addInit = el('input', { type: 'text', placeholder: 'Initials', maxlength: '4' });
  addName.addEventListener('input', () => { if (!addInit.value) addInit.value = addName.value.split(/\s+/).filter(Boolean).map(p=>p[0]).join('').toUpperCase().slice(0,3); });
  const addBtn = el('button', { class: 'btn', onclick: async () => {
    if (!addName.value.trim() || !addInit.value.trim()) { showToast('Name and initials required'); return; }
    const id = await dbPut('people', { name: addName.value.trim(), initials: addInit.value.toUpperCase() });
    people.push({ id, name: addName.value.trim(), initials: addInit.value.toUpperCase() });
    addName.value = ''; addInit.value = '';
    drawPeople();
  }}, '+ Add');

  root.append(
    el('div', { class: 'card' },
      el('h2', {}, 'Active collector'),
      el('div', { style: { fontSize: '16px', fontWeight: 600 } }, current ? `${current.name} (${current.initials})` : '—'),
    ),
    el('div', { class: 'card' },
      el('h2', {}, 'Team members (on this device)'),
      peopleHost,
      el('div', { class: 'row', style: { marginTop: '8px' } }, addName, addInit, addBtn)
    ),
    el('div', { class: 'card' },
      el('h2', {}, 'Team passcode'),
      el('p', { class: 'muted' }, 'Shared code the whole team uses. Used to tag syncs (enforced at sync time, coming soon).'),
      passIn
    ),
    el('div', { class: 'card' },
      el('h2', {}, 'Google Sheet sync URL'),
      el('p', { class: 'muted' }, 'Paste the Apps Script Web App URL here (see README for setup). Every device uses the same URL to write to the shared sheet.'),
      syncIn,
      el('div', { style: { marginTop: '8px' } }, testSyncBtn)
    ),
    el('div', { class: 'card' },
      el('h2', {}, 'About'),
      el('p', {}, 'Ichthyolog v0.3 · offline-first PWA · data lives on this phone until you export or sync.'),
    ),
  );
};

// ---------- Init ----------
(async () => {
  try {
    DB = await idbOpen();
    await initSeed();
    render();
    // Best-effort background pull of team reference lists (species, sites,
    // tissues, projects, etc.) + the sample mirror so autosuggest stays in
    // sync across phones. We don't block the UI — if the network is down or
    // the sync URL isn't set, we just skip silently. Don't run more than once
    // every 5 minutes to keep field-mode launches snappy.
    (async () => {
      try {
        const url = await getSetting('syncEndpoint');
        if (!url) return;
        const lastPull = (await getSetting('lastAutoPullAt')) || 0;
        if (Date.now() - lastPull < 5 * 60 * 1000) return;
        await pullTeamChanges();
        await setSetting('lastAutoPullAt', Date.now());
        // Quietly refresh whatever route is showing so new species/sites appear.
        requestRender();
      } catch (_) { /* offline / bad URL / etc. — silent */ }
    })();
  } catch (e) {
    document.body.innerHTML = '<p style="padding:20px">Database error: ' + e.message + '</p>';
    console.error(e);
  }
})();
</script>
